<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Invited resilience partnership</title><desc id="desc">A sovereign invitation and bilateral acceptance create a non-recallable civil service obligation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f8f"/></marker></defs>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">Invited resilience partnership</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Preparation is standing. Employment begins only with authenticated request and U.S. acceptance.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="75" y="230" width="250" height="130" rx="22" fill="#e9eef1" stroke="#5f6f78" stroke-width="4"/><text x="200" y="282" font-size="23" font-weight="700" fill="#17222b">STANDING COMPACT</text><text x="200" y="320" font-size="18" fill="#52616b">prepare · exercise · receive</text></g>
    <g><rect x="375" y="230" width="250" height="130" rx="22" fill="#eee9f4" stroke="#78659b" stroke-width="4"/><text x="500" y="282" font-size="23" font-weight="700" fill="#17222b">HOST REQUEST</text><text x="500" y="320" font-size="18" fill="#52616b">authenticated sovereignty</text></g>
    <g><rect x="675" y="230" width="250" height="130" rx="22" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="4"/><text x="800" y="282" font-size="23" font-weight="700" fill="#17222b">U.S. ACCEPTANCE</text><text x="800" y="320" font-size="18" fill="#52616b">exact service vector</text></g>
    <g><rect x="975" y="230" width="250" height="130" rx="22" fill="#fff1dd" stroke="#d89532" stroke-width="4"/><text x="1100" y="282" font-size="23" font-weight="700" fill="#17222b">NON-RECALL</text><text x="1100" y="320" font-size="18" fill="#52616b">family-complete serials</text></g>
    <g><rect x="1275" y="230" width="250" height="130" rx="22" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="4"/><text x="1400" y="282" font-size="23" font-weight="700" fill="#17222b">SERVICE</text><text x="1400" y="320" font-size="18" fill="#52616b">host-controlled receivers</text></g>
  </g>
  <g stroke="#2f6f8f" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M325 295 L375 295"/><path d="M625 295 L675 295"/><path d="M925 295 L975 295"/><path d="M1225 295 L1275 295"/></g>
  <rect x="100" y="470" width="425" height="180" rx="24" fill="#eee9f4" stroke="#78659b" stroke-width="3"/>
  <text x="312" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17222b">HOST SOVEREIGNTY</text>
  <text x="312" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">civil purpose · data custody</text><text x="312" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">receiver control · revocation</text><text x="312" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">operation · remedy · transfer</text>
  <rect x="587" y="470" width="425" height="180" rx="24" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="3"/>
  <text x="800" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17222b">SEPARATE PRODUCTION</text>
  <text x="800" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">partner serials · local workforce</text><text x="800" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">repair and evidence rights</text><text x="800" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">zero U.S. readiness credit</text>
  <rect x="1075" y="470" width="425" height="180" rx="24" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="3"/>
  <text x="1287" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17222b">BILATERAL EXIT</text>
  <text x="1287" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">effect · rights · workforce</text><text x="1287" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">title · data · residuals</text><text x="1287" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52616b">release · regeneration</text>
  <rect x="245" y="735" width="1110" height="90" rx="22" fill="#17222b"/>
  <text x="800" y="777" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">675 COMMITMENTS · 1,350 DUAL CORRIDOR CLAIMS</text>
  <text x="800" y="811" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#c9d5dc">Credibility comes from keeping a bounded promise without acquiring political control.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mature national force composition</title><desc id="desc">Four nonadditive force coordinates and the bridge from commitments to owned inventory.</desc>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">Mature national force composition</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">A matrix of unlike coordinates; a stock sized to survive reserve, geography and cycle.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><circle cx="245" cy="310" r="125" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="5"/><text x="245" y="295" font-size="54" font-weight="700" fill="#17222b">7</text><text x="245" y="337" font-size="22" fill="#52616b">SERVICES</text></g>
    <g><circle cx="615" cy="310" r="125" fill="#fff1dd" stroke="#d89532" stroke-width="5"/><text x="615" y="295" font-size="54" font-weight="700" fill="#17222b">6</text><text x="615" y="337" font-size="22" fill="#52616b">MISSION SYSTEMS</text></g>
    <g><circle cx="985" cy="310" r="125" fill="#eee9f4" stroke="#78659b" stroke-width="5"/><text x="985" y="295" font-size="54" font-weight="700" fill="#17222b">9</text><text x="985" y="337" font-size="22" fill="#52616b">EFFECT LEDGERS</text></g>
    <g><circle cx="1355" cy="310" r="125" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="5"/><text x="1355" y="295" font-size="54" font-weight="700" fill="#17222b">48</text><text x="1355" y="337" font-size="22" fill="#52616b">FORMATION FAMILIES</text></g>
  </g>
  <text x="800" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17222b">3 catastrophic + 5 major + 2 invited campaigns · 20% protected reserve · N−1 geography</text>
  <g font-family="Arial, sans-serif" font-size="22">
    <rect x="110" y="570" width="650" height="76" rx="18" fill="#2f6f8f"/><text x="145" y="617" fill="#ffffff" font-weight="700">2,420 simultaneous commitments</text>
    <rect x="760" y="570" width="135" height="76" fill="#d89532"/><text x="827" y="617" text-anchor="middle" fill="#17222b" font-weight="700">502</text>
    <rect x="895" y="570" width="190" height="76" fill="#8fb7c9"/><text x="990" y="617" text-anchor="middle" fill="#17222b" font-weight="700">745</text>
    <rect x="1085" y="570" width="405" height="76" rx="18" fill="#5f6f78"/><text x="1287" y="617" text-anchor="middle" fill="#ffffff" font-weight="700">1,584 cycle stock</text>
    <text x="827" y="679" text-anchor="middle" fill="#52616b">reserve</text><text x="990" y="679" text-anchor="middle" fill="#52616b">geographic buffer</text>
  </g>
  <rect x="300" y="745" width="1000" height="90" rx="22" fill="#17222b"/>
  <text x="800" y="787" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">5,251 OWNED FORMATION EQUIVALENTS</text>
  <text x="800" y="819" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#c9d5dc">3,667 ready serials · formation equivalents remain heterogeneous</text>
</svg>

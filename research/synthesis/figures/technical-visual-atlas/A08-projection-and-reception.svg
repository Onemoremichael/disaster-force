<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Projection and reception chain</title><desc id="desc">Force custody, mobility, receiver and local distribution form one complete service chain.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f8f"/></marker></defs>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">Projection is more than lift</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Every segment must carry custody, an alternate cause and a path back to readiness.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><circle cx="165" cy="360" r="92" fill="#eee9f4" stroke="#78659b" stroke-width="4"/><text x="165" y="350" font-size="22" font-weight="700" fill="#17222b">FORCE</text><text x="165" y="382" font-size="18" fill="#52616b">custody</text></g>
    <g><circle cx="375" cy="360" r="92" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="4"/><text x="375" y="350" font-size="22" font-weight="700" fill="#17222b">CARRIER</text><text x="375" y="382" font-size="18" fill="#52616b">air · sea · rail · road</text></g>
    <g><circle cx="585" cy="360" r="92" fill="#fff1dd" stroke="#d89532" stroke-width="4"/><text x="585" y="350" font-size="22" font-weight="700" fill="#17222b">ROUTE</text><text x="585" y="382" font-size="18" fill="#52616b">primary + alternate</text></g>
    <g><circle cx="795" cy="360" r="92" fill="#e9eef1" stroke="#5f6f78" stroke-width="4"/><text x="795" y="350" font-size="22" font-weight="700" fill="#17222b">NODE</text><text x="795" y="382" font-size="18" fill="#52616b">transfer + custody</text></g>
    <g><circle cx="1005" cy="360" r="92" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="4"/><text x="1005" y="350" font-size="22" font-weight="700" fill="#17222b">RECEIVER</text><text x="1005" y="382" font-size="18" fill="#52616b">prepared interface</text></g>
    <g><circle cx="1215" cy="360" r="92" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="4"/><text x="1215" y="350" font-size="22" font-weight="700" fill="#17222b">LOCAL</text><text x="1215" y="382" font-size="18" fill="#52616b">last-building access</text></g>
    <g><circle cx="1425" cy="360" r="92" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="4"/><text x="1425" y="350" font-size="22" font-weight="700" fill="#17222b">SERVICE</text><text x="1425" y="382" font-size="18" fill="#52616b">effect + sustainment</text></g>
  </g>
  <g stroke="#2f6f8f" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M257 360 L283 360"/><path d="M467 360 L493 360"/><path d="M677 360 L703 360"/><path d="M887 360 L913 360"/><path d="M1097 360 L1123 360"/><path d="M1307 360 L1333 360"/></g>
  <path d="M1425 470 C1425 700 375 700 375 470" fill="none" stroke="#d89532" stroke-width="7" stroke-dasharray="18 12" marker-end="url(#arrow)"/>
  <text x="900" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d89532">reverse flow · repair · residual custody · requalification</text>
  <rect x="280" y="745" width="1040" height="82" rx="20" fill="#ffffff" stroke="#b44b4b" stroke-width="3"/>
  <text x="800" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#b44b4b">A PLATFORM STRANDED AT AN UNPREPARED RECEIVER EARNS ZERO SERVICE CREDIT</text>
</svg>

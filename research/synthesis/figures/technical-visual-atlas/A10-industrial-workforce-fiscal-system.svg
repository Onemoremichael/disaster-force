<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Industrial, workforce and fiscal system</title><desc id="desc">A sovereign industrial estate, five workforce statuses and three public accounts sustain the mature force.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f8f"/></marker></defs>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">The establishment behind the force</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Industry, people and public accounts are readiness—not overhead hidden outside the platform.</text>
  <rect x="90" y="195" width="445" height="515" rx="28" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="4"/>
  <text x="312" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17222b">INDUSTRIAL SYSTEM</text>
  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#17222b"><rect x="145" y="285" width="335" height="68" rx="14" fill="#ffffff"/><text x="312" y="327">24 possible Root Houses</text><rect x="145" y="370" width="335" height="68" rx="14" fill="#ffffff"/><text x="312" y="412">public proving and reconstruction</text><rect x="145" y="455" width="335" height="68" rx="14" fill="#ffffff"/><text x="312" y="497">second sources + open interfaces</text><rect x="145" y="540" width="335" height="68" rx="14" fill="#ffffff"/><text x="312" y="582">24 public fallback cells</text><rect x="145" y="625" width="335" height="58" rx="14" fill="#fff1dd"/><text x="312" y="661">partner production: separate serials</text></g>
  <rect x="577" y="195" width="445" height="515" rx="28" fill="#eee9f4" stroke="#78659b" stroke-width="4"/>
  <text x="800" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17222b">13.0M AFFILIATIONS</text>
  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#17222b"><rect x="632" y="285" width="335" height="68" rx="14" fill="#ffffff"/><text x="800" y="327">5.57M National Career</text><rect x="632" y="370" width="335" height="68" rx="14" fill="#ffffff"/><text x="800" y="412">2.94M Ready Reserve</text><rect x="632" y="455" width="335" height="68" rx="14" fill="#ffffff"/><text x="800" y="497">2.43M Sovereign Covenant</text><rect x="632" y="540" width="335" height="68" rx="14" fill="#ffffff"/><text x="800" y="582">2.07M Productive Service</text><rect x="632" y="625" width="335" height="58" rx="14" fill="#ffffff"/><text x="800" y="661">20,700 Partner Fellows</text></g>
  <rect x="1065" y="195" width="445" height="515" rx="28" fill="#fff1dd" stroke="#d89532" stroke-width="4"/>
  <text x="1287" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17222b">$68.4T / 25 YEARS</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17222b"><rect x="1120" y="300" width="335" height="95" rx="16" fill="#ffffff"/><text x="1287" y="340" font-size="28" font-weight="700">$1.00T</text><text x="1287" y="373" font-size="19">technology + industrialization</text><rect x="1120" y="420" width="335" height="95" rx="16" fill="#ffffff"/><text x="1287" y="460" font-size="28" font-weight="700">$17.4T</text><text x="1287" y="493" font-size="19">force + estate capital</text><rect x="1120" y="540" width="335" height="95" rx="16" fill="#ffffff"/><text x="1287" y="580" font-size="28" font-weight="700">$50.0T</text><text x="1287" y="613" font-size="19">ramped operations</text></g>
  <g stroke="#2f6f8f" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M535 455 L577 455"/><path d="M1022 455 L1065 455"/></g>
  <rect x="250" y="760" width="1100" height="82" rx="20" fill="#17222b"/>
  <text x="800" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">CAPITAL · OPERATIONS · INCIDENTS · TRANSFERS · MARKETS · AVOIDED LOSS</text>
  <text x="800" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c9d5dc">Six separate ledgers. Commercial value and avoided loss never erase public readiness cost.</text>
</svg>

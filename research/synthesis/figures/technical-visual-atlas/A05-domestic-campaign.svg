<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Domestic campaign doctrine</title><desc id="desc">Domestic resilience begins with protected local continuity and moves only those who cannot remain safely.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6f8f"/></marker></defs>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">Domestic campaign: protect, reach, move selectively, return</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Local continuity and national projection are one service system.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="85" y="245" width="250" height="150" rx="22" fill="#eee9f4" stroke="#78659b" stroke-width="4"/><text x="210" y="298" font-size="24" font-weight="700" fill="#17222b">CIVIL ACTIVATION</text><text x="210" y="335" font-size="19" fill="#52616b">lawful authority</text><text x="210" y="365" font-size="19" fill="#52616b">service vector · rights</text></g>
    <g><rect x="385" y="245" width="250" height="150" rx="22" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="4"/><text x="510" y="298" font-size="24" font-weight="700" fill="#17222b">PROTECT LOCAL</text><text x="510" y="335" font-size="19" fill="#52616b">power · water · thermal</text><text x="510" y="365" font-size="19" fill="#52616b">medical · communication</text></g>
    <g><rect x="685" y="245" width="250" height="150" rx="22" fill="#fff1dd" stroke="#d89532" stroke-width="4"/><text x="810" y="298" font-size="24" font-weight="700" fill="#17222b">CONTROL HAZARD</text><text x="810" y="335" font-size="19" fill="#52616b">fire · flood · debris</text><text x="810" y="365" font-size="19" fill="#52616b">lifelines · building access</text></g>
    <g><rect x="985" y="245" width="250" height="150" rx="22" fill="#e5f0f4" stroke="#2f6f8f" stroke-width="4"/><text x="1110" y="298" font-size="24" font-weight="700" fill="#17222b">MOVE BY NEED</text><text x="1110" y="335" font-size="19" fill="#52616b">accessible collection</text><text x="1110" y="365" font-size="19" fill="#52616b">verified destination</text></g>
    <g><rect x="1285" y="245" width="230" height="150" rx="22" fill="#eaf2ec" stroke="#5c8c6b" stroke-width="4"/><text x="1400" y="298" font-size="24" font-weight="700" fill="#17222b">RETURN</text><text x="1400" y="335" font-size="19" fill="#52616b">habitable place</text><text x="1400" y="365" font-size="19" fill="#52616b">force regeneration</text></g>
  </g>
  <g stroke="#2f6f8f" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M335 320 L385 320"/><path d="M635 320 L685 320"/><path d="M935 320 L985 320"/><path d="M1235 320 L1285 320"/></g>
  <rect x="210" y="510" width="1180" height="160" rx="28" fill="#17222b"/>
  <text x="800" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">THE NEIGHBORHOOD SEAM</text>
  <text x="800" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#c9d5dc">household contact · vertical access · caregiver continuity · medical power · offline records</text>
  <text x="800" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#c9d5dc">family-complete movement · receiver admission · lawful civil custody</text>
  <rect x="330" y="745" width="940" height="78" rx="20" fill="#ffffff" stroke="#b44b4b" stroke-width="3"/>
  <text x="800" y="794" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b44b4b">A WEAK LOCAL ARCHITECTURE MANUFACTURES PASSENGERS AND QUEUES</text>
</svg>

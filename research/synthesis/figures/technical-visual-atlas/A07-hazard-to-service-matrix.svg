<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hazard-to-service matrix</title><desc id="desc">Hazard-specific physics connects to common civilian service obligations.</desc>
  <rect width="1600" height="900" fill="#f5f7f8"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17222b">Hazard physics; complete service chains</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Specialization lives in sensing, materials and tactics. Force credit follows civilian effect.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="190" width="1440" height="80" rx="18" fill="#17222b"/>
    <text x="210" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">HAZARD</text><text x="620" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">PHYSICAL INTERVENTION</text><text x="1130" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">SERVICE THAT MUST CLOSE</text>
    <g font-size="20" fill="#17222b">
      <rect x="80" y="285" width="1440" height="78" rx="12" fill="#f5e8e8"/><text x="210" y="333" text-anchor="middle" font-weight="700">FIRE</text><text x="620" y="333" text-anchor="middle">sense · intercept · suppress · ground hold</text><text x="1130" y="333" text-anchor="middle">community protection · clean air · watershed recovery</text>
      <rect x="80" y="375" width="1440" height="78" rx="12" fill="#e5f0f4"/><text x="210" y="423" text-anchor="middle" font-weight="700">FLOOD</text><text x="620" y="423" text-anchor="middle">barrier · pump · debris · breach control</text><text x="1130" y="423" text-anchor="middle">drainage · access · potable water · occupied-place service</text>
      <rect x="80" y="465" width="1440" height="78" rx="12" fill="#fff1dd"/><text x="210" y="513" text-anchor="middle" font-weight="700">DROUGHT</text><text x="620" y="513" text-anchor="middle">source · treatment · recharge · rapid pipeline</text><text x="1130" y="513" text-anchor="middle">tested water · equitable distribution · residual custody</text>
      <rect x="80" y="555" width="1440" height="78" rx="12" fill="#e9eef1"/><text x="210" y="603" text-anchor="middle" font-weight="700">EARTHQUAKE</text><text x="620" y="603" text-anchor="middle">clear · assess · shore · bridge utilities</text><text x="1130" y="603" text-anchor="middle">building access · clinical continuity · habitable return</text>
      <rect x="80" y="645" width="1440" height="78" rx="12" fill="#eee9f4"/><text x="210" y="693" text-anchor="middle" font-weight="700">HEAT / COLD</text><text x="620" y="693" text-anchor="middle">firm source · thermal distribution · building entry</text><text x="1130" y="693" text-anchor="middle">safe temperature · medical power · vertical service</text>
      <rect x="80" y="735" width="1440" height="78" rx="12" fill="#eaf2ec"/><text x="210" y="783" text-anchor="middle" font-weight="700">STORM</text><text x="620" y="783" text-anchor="middle">anticipate · protect · enter · repair</text><text x="1130" y="783" text-anchor="middle">water · power · communication · mobility · regeneration</text>
    </g>
  </g>
</svg>
